<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>眨眨 · 家长远程查看</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
      padding: 12px;
    }
    .header {
      text-align: center;
      padding: 12px 0 16px;
      border-bottom: 1px solid #333;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 18px; color: #4FC3F7; }
    .header .sub { font-size: 12px; color: #999; margin-top: 4px; }
    .panel {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .panel input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #4FC3F7;
      background: #1a1a1a;
      color: #fff;
      border-radius: 8px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .panel button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .panel button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .panel .alt {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #888;
    }
    .panel .alt a { color: #4FC3F7; cursor: pointer; text-decoration: underline; }
    .status {
      text-align: center;
      padding: 8px;
      margin: 8px 0;
      font-size: 13px;
      color: #aaa;
    }
    .status.connected { color: #4CAF50; }
    .status.error { color: #f44336; }
    .status.loading { color: #FF9800; }
    .preview-box {
      background: #000;
      border-radius: 8px;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .preview-box img {
      max-width: 100%;
      max-height: 100%;
    }
    .preview-box .placeholder {
      color: #555;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }
    .preview-box .ts {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat-card .label {
      font-size: 11px;
      color: #999;
      margin-bottom: 4px;
    }
    .stat-card .value {
      font-size: 22px;
      font-weight: bold;
      color: #4FC3F7;
    }
    .stat-card.good .value { color: #4CAF50; }
    .stat-card.bad .value { color: #f44336; }
    .stat-card .unit { font-size: 12px; color: #999; }
    .refresh-btn {
      width: 100%;
      padding: 10px;
      background: #2196F3;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .logout-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: #888;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .tips {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 16px;
      line-height: 1.6;
    }
    a { color: #4FC3F7; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>👁 眨眨 · 家长远程查看</h1>
    <div class="sub">用孩子端绑定的手机号登录，即可实时查看</div>
  </div>

  <!-- 登录面板 -->
  <div class="panel" id="loginPanel">
    <input id="loginPhone" type="tel" placeholder="手机号" maxlength="11" />
    <input id="loginPwd" type="password" placeholder="密码（孩子端设置的密码）" />
    <button id="loginBtn">登录 / 注册</button>
    <p id="loginMsg" style="font-size:12px;color:#999;margin:8px 0 0;min-height:16px;"></p>
    <div class="alt">
      没有配对码？<a id="showPairMode">用配对码连接</a>
    </div>
  </div>

  <!-- 配对码面板（备用） -->
  <div class="panel hidden" id="pairPanel">
    <input id="pairCode" type="text" placeholder="输入配对码 (如 BGAB12)" maxlength="6" style="text-transform:uppercase;letter-spacing:2px;text-align:center;" />
    <button id="pairBtn">配对连接</button>
    <div class="alt">
      <a id="showLoginMode">返回手机号登录</a>
    </div>
  </div>

  <!-- 已登录信息 -->
  <div class="panel hidden" id="userPanel">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:12px;color:#999;">已登录手机号</div>
        <div id="userPhone" style="font-size:18px;font-weight:bold;color:#4FC3F7;"></div>
      </div>
      <button id="logoutBtn" class="logout-btn" style="width:auto;">退出</button>
    </div>
  </div>

  <div class="status" id="status">请先登录</div>

  <div class="preview-box" id="previewBox">
    <div class="placeholder">登录后自动连接孩子设备<br>孩子端需打开监控并登录同一手机号</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card good">
      <div class="label">专注率</div>
      <div class="value" id="focusRate">--<span class="unit">%</span></div>
    </div>
    <div class="stat-card">
      <div class="label">监控时长</div>
      <div class="value" id="duration">--<span class="unit">分</span></div>
    </div>
    <div class="stat-card good">
      <div class="label">专注段数</div>
      <div class="value" id="focusSessions">--</div>
    </div>
    <div class="stat-card bad">
      <div class="label">不专注次数</div>
      <div class="value" id="badCount">--</div>
    </div>
  </div>

  <button class="refresh-btn" id="refreshBtn">立即刷新</button>

  <div class="tips">
    💡 在孩子手机上用家长手机号登录「眨眨」，即可自动绑定<br>
    本页面用同一手机号登录后自动连接，无需配对码<br>
    <a href="./">返回主应用</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://ibwbebrwyjjukmmsfipa.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_F1qdhcIQgN78C7QdXEqN8Q_IU7E55rY';
    let supabaseClient = null;
    let currentUser = null;
    let peer = null;
    let conn = null;
    let rtChannel = null;
    let kidPeerId = null;

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (type || '');
    }

    function updateStats(data) {
      if (!data) return;
      document.getElementById('focusRate').innerHTML = (data.focusRate ?? 0) + '<span class="unit">%</span>';
      document.getElementById('duration').innerHTML = (data.durationMin ?? 0) + '<span class="unit">分</span>';
      document.getElementById('focusSessions').textContent = data.focusSessions ?? 0;
      document.getElementById('badCount').textContent = data.badCount ?? 0;
    }

    function updateSnapshot(dataUrl, ts) {
      const box = document.getElementById('previewBox');
      box.innerHTML = '<img src="' + dataUrl + '" alt="摄像头画面" /><div class="ts">' + new Date(ts).toLocaleTimeString() + '</div>';
    }

    function showUserPanel() {
      const phone = (currentUser?.email || '').replace('@blink.local', '');
      document.getElementById('userPhone').textContent = phone;
      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('pairPanel').classList.add('hidden');
      document.getElementById('userPanel').classList.remove('hidden');
    }

    function showLoginPanel() {
      document.getElementById('loginPanel').classList.remove('hidden');
      document.getElementById('pairPanel').classList.add('hidden');
      document.getElementById('userPanel').classList.add('hidden');
    }

    function showPairPanel() {
      document.getElementById('pairPanel').classList.remove('hidden');
      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('userPanel').classList.add('hidden');
    }

    // 加载 Supabase
    function loadSupabase() {
      return new Promise((resolve, reject) => {
        if (window.supabase) return resolve();
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        s.async = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('Supabase 加载失败'));
        document.head.appendChild(s);
      });
    }

    // 加载 PeerJS
    function loadPeerJS() {
      return new Promise((resolve, reject) => {
        if (window.Peer) return resolve();
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
        s.async = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('PeerJS 加载失败'));
        document.head.appendChild(s);
      });
    }

    function setLoginMsg(text, color) {
      const el = document.getElementById('loginMsg');
      if (el) { el.textContent = text; el.style.color = color || '#999'; }
    }

    // 通过 Supabase Realtime 找到孩子的 peer_id 并连接
    async function connectViaRealtime() {
      if (!supabaseClient || !currentUser) return;
      const phone = (currentUser.email || '').replace('@blink.local', '');
      const channelName = 'bg:parent:' + phone;

      // 清理旧频道
      if (rtChannel) { try { supabaseClient.removeChannel(rtChannel); } catch(e){} rtChannel = null; }

      setStatus('正在查找孩子设备...', 'loading');
      await loadPeerJS();

      // 家长端用随机 PeerJS id
      if (!peer) {
        peer = new Peer('viewer-' + Math.random().toString(36).substr(2, 8), {
          debug: 1,
          config: { iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
          ]}
        });
        peer.on('error', (err) => console.warn('peer error', err));
      }

      rtChannel = supabaseClient.channel(channelName);
      rtChannel
        .on('broadcast', { event: 'kid_online' }, (payload) => {
          const p = payload.payload;
          if (p?.peer_id) {
            kidPeerId = p.peer_id;
            console.log('[Remote] 收到孩子 peer_id:', kidPeerId);
            setStatus('已发现孩子设备，正在连接...', 'loading');
            connectToKid(kidPeerId);
          }
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            console.log('[Remote] 已加入频道，请求孩子上报');
            // 请求孩子上报 peer_id
            rtChannel.send({
              type: 'broadcast',
              event: 'parent_wants',
              payload: { ts: Date.now() }
            }).catch(() => {});
          }
        });
    }

    // 连接孩子的 PeerJS
    function connectToKid(peerId) {
      if (conn) { try { conn.close(); } catch(e){} conn = null; }
      conn = peer.connect(peerId, { reliable: true });
      conn.on('open', () => {
        setStatus('已连接，正在获取画面...', 'connected');
        conn.send({ type: 'cmd', cmd: 'getStats' });
        conn.send({ type: 'cmd', cmd: 'snapshot' });
      });
      conn.on('data', (msg) => {
        if (!msg) return;
        if (msg.type === 'stats') updateStats(msg.data);
        else if (msg.type === 'snapshot') updateSnapshot(msg.data, msg.ts);
      });
      conn.on('close', () => {
        setStatus('连接已断开，等待孩子设备...', 'error');
        // 重新请求
        setTimeout(() => {
          if (rtChannel) rtChannel.send({ type:'broadcast', event:'parent_wants', payload:{ts:Date.now()} }).catch(()=>{});
        }, 3000);
      });
      conn.on('error', (e) => setStatus('连接错误: ' + (e.message||e), 'error'));
    }

    // 配对码模式（备用）
    async function connectByPairCode() {
      const code = document.getElementById('pairCode').value.trim().toUpperCase();
      if (!code) { setStatus('请输入配对码', 'error'); return; }
      await loadPeerJS();
      if (!peer) {
        peer = new Peer('viewer-' + Math.random().toString(36).substr(2, 8), {
          debug: 1,
          config: { iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
          ]}
        });
      }
      setStatus('正在连接配对码 ' + code + '...', 'loading');
      peer.on('open', () => connectToKid(code));
      peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') setStatus('配对码无效或孩子设备不在线', 'error');
        else setStatus('错误: ' + err.type, 'error');
      });
    }

    // 登录
    async function handleLogin() {
      if (!supabaseClient) { setLoginMsg('服务未就绪', '#f44'); return; }
      const phone = document.getElementById('loginPhone').value.trim().replace(/\D/g, '');
      const pwd = document.getElementById('loginPwd').value;
      if (!/^\d{11}$/.test(phone)) { setLoginMsg('请输入11位手机号', '#f44'); return; }
      if (pwd.length < 6) { setLoginMsg('密码至少6位', '#f44'); return; }

      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = '登录中...';
      setLoginMsg('正在登录...', '#2196F3');

      const email = phone + '@blink.local';
      const { error: signInErr } = await supabaseClient.auth.signInWithPassword({ email, password: pwd });
      if (!signInErr) {
        setLoginMsg('登录成功！', '#4CAF50');
        return;
      }
      // 新用户注册
      setLoginMsg('新用户，正在注册...', '#2196F3');
      const { error: signUpErr } = await supabaseClient.auth.signUp({ email, password: pwd });
      btn.disabled = false; btn.textContent = '登录 / 注册';
      if (signUpErr) {
        setLoginMsg('注册失败：' + signUpErr.message, '#f44');
        return;
      }
      setLoginMsg('注册成功，请再次点击登录', '#FF9800');
    }

    // 初始化
    (async function init() {
      try {
        await loadSupabase();
      } catch (e) {
        setStatus('服务加载失败，请检查网络', 'error');
        return;
      }
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
      });

      // 绑定登录按钮
      document.getElementById('loginBtn').addEventListener('click', handleLogin);
      document.getElementById('pairBtn').addEventListener('click', connectByPairCode);
      document.getElementById('showPairMode').addEventListener('click', showPairPanel);
      document.getElementById('showLoginMode').addEventListener('click', showLoginPanel);
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
      });

      document.getElementById('refreshBtn').addEventListener('click', () => {
        if (conn && conn.open) {
          conn.send({ type: 'cmd', cmd: 'getStats' });
          conn.send({ type: 'cmd', cmd: 'snapshot' });
          setStatus('刷新中...', 'connected');
        } else if (rtChannel) {
          rtChannel.send({ type:'broadcast', event:'parent_wants', payload:{ts:Date.now()} }).catch(()=>{});
        } else {
          setStatus('请先登录', 'error');
        }
      });

      document.getElementById('pairCode').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') connectByPairCode();
      });

      // 恢复登录态
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
        currentUser = session.user;
        showUserPanel();
        connectViaRealtime();
      }

      // 监听登录状态
      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (session && session.user) {
          currentUser = session.user;
          if (event === 'SIGNED_IN') {
            showUserPanel();
            connectViaRealtime();
          }
        } else {
          currentUser = null;
          showLoginPanel();
          setStatus('已退出登录', 'error');
          if (rtChannel) { try { supabaseClient.removeChannel(rtChannel); } catch(e){} rtChannel = null; }
        }
      });
    })();
  </script>
</body>
</html>
